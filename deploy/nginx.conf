server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://reef:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

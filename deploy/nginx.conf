server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;

    # 管理员上传新版 Crab 可执行 JAR（服务端硬上限 64 MiB）；其余接口仍维持 2m 上限。
    location = /api/admin/crab/upload {
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://reef:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 流式下载 21+ MiB Crab 可执行 JAR，关闭代理盘缓冲避免慢链路超时。
    location = /api/admin/crab/download {
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://reef:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://reef:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

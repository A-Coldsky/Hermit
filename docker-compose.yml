services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hermit
      MYSQL_USER: hermit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - reef-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  reef:
    image: hermit-reef
    build: .
    # eclipse-temurin:17-jre 基于 Ubuntu，/bin/sh 是 dash，脚本保持 POSIX。
    entrypoint:
      - /bin/sh
      - -c
      - |
        token=$$(printf '%s' "$$HERMIT_REEF_AGENT_TOKEN" | tr -d '[:space:]')
        if [ -z "$$token" ]; then
          echo '必须设置 HERMIT_REEF_AGENT_TOKEN，空令牌不会启动 Reef。' >&2
          exit 1
        fi
        exec java -jar /app/reef.jar
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/hermit?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: hermit
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # 与 application.yml 的 spring.flyway.table 相同。MySQL 约束名在库内全局唯一，所以一并加前缀。
      SPRING_FLYWAY_TABLE: hermit_flyway_schema_history
      HERMIT_REEF_DATA_DIR: /data
      HERMIT_REEF_AGENT_TOKEN: ${HERMIT_REEF_AGENT_TOKEN}
      HERMIT_REEF_ADMIN_USER: ${HERMIT_REEF_ADMIN_USER}
      HERMIT_REEF_ADMIN_PASSWORD: ${HERMIT_REEF_ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
    volumes:
      - reef-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  nginx:
    image: nginx:1.28
    depends_on:
      reef:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # 和 Reef 共用 HERMIT_REEF_AGENT_TOKEN，入口脚本把它写成 reef.token。
  # 宿主机网络 + 只听 127.0.0.1，控制台的回环校验才仍然成立。不要改成端口映射。
  crab:
    profiles: ["client"]
    image: hermit-crab
    build:
      context: .
      dockerfile: Dockerfile.crab
    network_mode: host
    depends_on:
      reef:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      HERMIT_HOME: /var/lib/hermit
      HERMIT_REEF_URL: http://127.0.0.1:${HTTP_PORT:-80}
      HERMIT_REEF_AGENT_TOKEN: ${HERMIT_REEF_AGENT_TOKEN}
      HERMIT_REEF_ADMIN_USER: ${HERMIT_REEF_ADMIN_USER}
      HERMIT_REEF_ADMIN_PASSWORD: ${HERMIT_REEF_ADMIN_PASSWORD}
      HERMIT_CRAB_PORT: ${HERMIT_CRAB_PORT:-7777}
      HERMIT_CRAB_INSTANCE_ID: ${HERMIT_CRAB_INSTANCE_ID:-}
      HERMIT_MASTER_KEY: ${HERMIT_MASTER_KEY:-}
      HERMIT_MASTER_KEY_FILE: ${HERMIT_MASTER_KEY_FILE:-}
      TZ: UTC
    volumes:
      - crab-data:/var/lib/hermit
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${HERMIT_CRAB_PORT:-7777}/console/\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  reef-mysql:
  reef-data:
  crab-data:

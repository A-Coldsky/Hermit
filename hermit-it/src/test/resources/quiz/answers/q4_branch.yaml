conch: quiz
version: 1.0.0
driver: http
min_crab_version: 1.9.0
base_url: http://127.0.0.1:18080
title: 测验
description: 写规则测验的参考答案。
credentials: {}
actions:
  run:
    title: 查询额度
    description: 按用户等级查询额度。
    idempotent: true
    input:
      user: {type: string, required: true, description: 用户名}
    steps:
      - request: {method: GET, path: /profile, query: {user: "{{input.user}}"}}
      - extract:
          level: {jsonpath: "$.level"}
      - if:
          equals: {level: "vip"}
          then:
            - request: {method: GET, path: /vip/quota}
          else:
            - request: {method: GET, path: /quota}
      - extract:
          quota: {jsonpath: "$.quota"}
    output:
      quota: {type: integer, description: 额度}
    examples:
      - input: {user: ann}
        output: {quota: 500}
    notes: 只读。
    related: []

# spring.datasource.url 可覆盖由 data-dir 推导的地址。驱动随 URL 走，这里不指定驱动类。
hermit:
  reef:
    data-dir: ./reef-data
    agent-token: ""
    jwt-ttl: 8h
    latest-crab-version: ""
    crab-download-url: ""
    report-retention-days: 90
    tide:
      new-version-min-calls: 20
      regression-delta: "0.20"
      no-baseline-failure-rate: "0.50"
      baseline-window-days: 7
      surge-window-minutes: 15
      surge-min-count: 10
      quiet-hours: 24
      dedup-hours: 6
      webhook-url: ""
      evaluate-cron: "0 */5 * * * *"

spring:
  application:
    name: hermit-reef
  servlet:
    multipart:
      # Shell 上传上限。容器先拒绝，服务里再查一次字节长度。
      max-file-size: 1MB
      max-request-size: 1MB
  datasource:
    url: jdbc:h2:file:${hermit.reef.data-dir}/db/reef;MODE=REGULAR
    username: sa
    password: ""
  flyway:
    placeholder-replacement: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  # 原生运行时没有 Nginx 在前面压缩，页面脚本和样式由 Tomcat 自己 gzip。
  # 只压缩静态资源类型，接口 JSON 不在列表里，避免带令牌的响应被压缩。
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,image/svg+xml
    min-response-size: 2KB

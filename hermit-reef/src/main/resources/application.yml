# spring.datasource.url 可覆盖由 data-dir 推导的地址，便于以后换 MySQL / PostgreSQL。
hermit:
  reef:
    data-dir: ./reef-data
    agent-token: ""
    jwt-ttl: 8h
    latest-crab-version: ""
    crab-download-url: ""
    report-retention-days: 90
    tide:
      new-version-min-calls: 20
      regression-delta: "0.20"
      no-baseline-failure-rate: "0.50"
      baseline-window-days: 7
      surge-window-minutes: 15
      surge-min-count: 10
      quiet-hours: 24
      dedup-hours: 6
      webhook-url: ""

spring:
  application:
    name: hermit-reef
  datasource:
    url: jdbc:h2:file:${hermit.reef.data-dir}/db/reef;MODE=REGULAR
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    placeholder-replacement: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

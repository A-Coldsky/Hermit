# spring.datasource.url 可覆盖由 data-dir 推导的地址，便于以后换 MySQL / PostgreSQL。
hermit:
  reef:
    data-dir: ./reef-data
    agent-token: ""
    jwt-ttl: 8h
    latest-crab-version: ""
    crab-download-url: ""
    report-retention-days: 90

spring:
  application:
    name: hermit-reef
  datasource:
    url: jdbc:h2:file:${hermit.reef.data-dir}/db/reef;MODE=REGULAR
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    placeholder-replacement: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

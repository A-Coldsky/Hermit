    <title>Crab 控制台 · Hermit</title>
    <script>
      // 首帧前按上次选择或系统偏好设定明暗，避免先白后黑的闪烁。键名与 shared/color-mode.ts 一致。
      try {
        var mode = localStorage.getItem('hermit.color-mode')
        if (mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>

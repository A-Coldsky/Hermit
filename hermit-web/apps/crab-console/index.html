    <script>
      // 首帧前按上次选择或系统偏好设定明暗，避免先白后黑的闪烁。键名与 shared/color-mode.ts 一致。

        var mode = localStorage.getItem('hermit.color-mode')

          document.documentElement.classList.add('dark')
        }
      } catch (e) {}

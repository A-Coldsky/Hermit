<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2310272b%27/%3E%3Cpath d=%27M6 22c0-7 5-13 12-13 4 0 8 3 8 8v5H6z%27 fill=%27%2314b8a6%27/%3E%3Cpath d=%27M4 24h24%27 stroke=%27%23f59e0b%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
    <title>Reef 管理端 · Hermit</title>
    <script>
      // 首帧前按上次选择或系统偏好设定明暗，避免先白后黑的闪烁。键名与 shared/color-mode.ts 一致。
      try {
        var mode = localStorage.getItem('hermit.color-mode')
        if (mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
